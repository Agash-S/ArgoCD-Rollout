apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: devops-demo
  namespace: prod
  labels:
    app: devops-demo
spec:
  replicas: 4
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: devops-demo

  template:
    metadata:
      labels:
        app: devops-demo

    spec:
      serviceAccountName: devops-demo
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: devops-demo

      containers:
        - name: devops-demo
          image: helloootiger/flask-health-rollout:v1

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: APP_VERSION
              value: v1
            - name: APP_ENVIRONMENT
              value: prod
            - name: FAIL_PERCENT
              value: "0"
            - name: AWS_REGION
              value: ap-south-1
            - name: CLOUDWATCH_NAMESPACE
              value: DevOpsDemo

          envFrom:
            - configMapRef:
                name: devops-demo-config

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: tmp
          emptyDir: {}

  strategy:
    canary:
      stableService: devops-demo-stable
      canaryService: devops-demo-canary

      trafficRouting:
        alb:
          ingress: devops-demo
          rootService: devops-demo-root
          servicePort: 80

      maxSurge: 25%
      maxUnavailable: 0

      steps:
        - setWeight: 5
        - pause:
            duration: 3m
        - analysis:
            templates:
              - templateName: devops-demo-canary-analysis

        - setWeight: 20
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: devops-demo-canary-analysis

        - setWeight: 50
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: devops-demo-canary-analysis

        - setWeight: 100