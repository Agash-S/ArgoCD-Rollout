apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-demo-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPOSITORY.git
    targetRevision: main
    path: app/dev
    directory: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true